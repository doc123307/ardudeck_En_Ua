# Builds the ardudeck-wfb-rx sidecar (tools/wfb-rx) for the desktop platforms
# and attaches the binaries to a release when a wfb-rx-v* tag is pushed.
# Asset names must match wfbRxAssetName() in media-binaries-downloader.ts:
#   ardudeck-wfb-rx-<platform>-<arch>[.exe]   (platform = darwin|linux|win32)
# Each binary links libusb/libsodium statically: it is downloaded on its own.
name: Build wfb-rx

on:
  workflow_dispatch:
  push:
    tags:
      - 'wfb-rx-v*'
  pull_request:
    paths:
      - 'tools/wfb-rx/**'
      - '.github/workflows/build-wfb-rx.yml'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: ardudeck-wfb-rx-darwin-arm64
          - os: macos-15-intel
            asset: ardudeck-wfb-rx-darwin-x64
          - os: ubuntu-22.04
            asset: ardudeck-wfb-rx-linux-x64
          # Cross-built with llvm-mingw: the same script works locally on macOS/Linux.
          - os: ubuntu-22.04
            asset: ardudeck-wfb-rx-win32-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libusb libsodium pkg-config

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux' && !endsWith(matrix.asset, '.exe')
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libudev-dev libsodium-dev libpcap-dev pkg-config

      - name: Build (native)
        if: ${{ !endsWith(matrix.asset, '.exe') }}
        working-directory: tools/wfb-rx
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
          ./build/bin/ardudeck-wfb-rx --version
          cp build/bin/ardudeck-wfb-rx "$GITHUB_WORKSPACE/${{ matrix.asset }}"

      - name: Build (Windows cross)
        if: endsWith(matrix.asset, '.exe')
        run: |
          tools/wfb-rx/scripts/build-win-mingw.sh "$RUNNER_TEMP/wfb-rx-win"
          cp "$RUNNER_TEMP/wfb-rx-win/dist/${{ matrix.asset }}" "${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      # Pre-release and never "latest": the app updater reads the latest release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/wfb-rx-v')
        uses: softprops/action-gh-release@v2
        with:
          name: wfb-ng receiver ${{ github.ref_name }}
          prerelease: true
          make_latest: false
          files: ${{ matrix.asset }}
